site_name: 景旭的编程笔记
site_description: 编程学习、课程教程与后端面试复习
site_author: JingXu
site_url: https://jingxu-huan.github.io/learningnote/
repo_url: https://github.com/JingXu-Huan/learningnote
repo_name: JingXu-Huan/learningnote
edit_uri: edit/master/
# Existing bootstrap directory; the hook replaces it with filtered note copies
# before MkDocs discovers any pages or static files.
docs_dir: website
site_dir: .cache/pages/site
use_directory_urls: true
hooks:
  - website/hooks.py

theme:
  name: shadcn
  custom_dir: website/overrides
  # Chinese controls are supplied by our overrides; upstream has no zh catalog.
  locale: en
  show_title: true
  show_stargazers: false
  hide_source_files: true
  search_index_only: true
  topbar_sections: false
  katex_options: {}

plugins:
  - search:
      min_search_length: 1
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - codehilite
  - pymdownx.highlight:
      css_class: codehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - assets/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
  - assets/wiki.js

extra_css:
  - assets/wiki.css

validation:
  links:
    # Existing notes contain historical heading anchors. Keep those visible
    # without making unrelated old anchors fail the publication pipeline.
    anchors: info
